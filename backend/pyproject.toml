[project]
name = "lms-backend"
version = "0.1.0"
description = "FastAPI backend for the TeluguAI/GenAI99 LMS - Student module"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "pyjwt>=2.10",
    "bcrypt>=4.3",
    "greenlet>=3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
]
